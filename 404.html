<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ページが見つかりません — Daily AI Brief</title><style>
  :root{--bg:#0B0F19;--card:#151B2B;--tx:#E5E7EB;--mu:#9CA3AF;--bl:#60A5FA;--am:#F59E0B;--gr:#34D399}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;line-height:1.6}
  .w{max-width:760px;margin:0 auto;padding:18px 14px 60px}
  h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
  .nav a{display:inline-block;margin:0 8px 12px 0;padding:4px 10px;border:1px solid rgba(255,255,255,.3);border-radius:999px;color:inherit;text-decoration:none;font-size:12px}
  .kpi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.kpi div{background:var(--card);border-radius:10px;padding:8px 12px;font-size:13px}
  .kpi b{font-size:18px;display:block}
  .unread-list{background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.35);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:16px}
  .unread-list a{color:var(--am);margin-right:10px;text-decoration:none}
  details{background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:10px}
  details.unread{border:1px solid rgba(245,158,11,.5)}details.missing{opacity:.55}
  summary{cursor:pointer;font-size:14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}.tag{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .tag.unread{background:rgba(245,158,11,.2);color:var(--am)}.tag.read{background:rgba(52,211,153,.15);color:var(--gr)}.tag.missing{background:rgba(156,163,175,.15);color:var(--mu)}
  .row{display:flex;gap:8px;font-size:13px;padding:4px 0;border-top:1px solid rgba(255,255,255,.05)}.row .cat{color:var(--mu);white-space:nowrap;min-width:64px}
  .row a{color:inherit;text-decoration:none}.row a:hover{color:var(--bl)}
  .open{margin-top:8px;font-size:12px}.open a{color:var(--bl)}
  .ftr{color:var(--mu);font-size:11px;margin-top:20px}
</style></head>
<body><div class="w"><h1>🧭 その日のブリーフはありません</h1>
<div class="sub" id="msg">PCが起動していなかった日は生成されません。最寄りの日へ移動します…</div>
<div class="nav"><a href="./index.html">🧠 今日のブリーフ</a><a href="./weekly.html">📅 週間</a><a href="./monthly.html">🗓 月間</a></div>
<script>
(function(){
  const DATES=["20260629", "20260630", "20260701", "20260702", "20260703", "20260704", "20260705", "20260706", "20260707", "20260708", "20260709", "20260710", "20260711", "20260712", "20260713", "20260714", "20260715", "20260716", "20260717", "20260718", "20260719", "20260720", "20260728", "20260729", "20260730", "20260801", "20260802", "20260803", "20260804", "20260806", "20260808", "20260820", "20260821", "20260822", "20260823", "20260824", "20260825", "20260826", "20260827", "20260903", "20260904", "20260905"];
  const m=(location.pathname.match(/(20\d{6})\.html/)||[])[1];
  if(!m){document.getElementById('msg').textContent='URLが正しくないようです。上のリンクから移動してください。';return;}
  const older=DATES.filter(x=>x<m), newer=DATES.filter(x=>x>m);
  const target=older.length?older[older.length-1]:(newer.length?newer[0]:'');
  if(target){document.getElementById('msg').textContent=m.slice(4,6)+'/'+m.slice(6,8)+' は未生成です。'+target.slice(4,6)+'/'+target.slice(6,8)+' のブリーフへ移動します…';
    setTimeout(()=>location.replace('./'+target+'.html'),900);}
})();
</script></div></body></html>
